; Shared PlatformIO settings for every project on the kit (examples/ and my_projects/).
; A project's platformio.ini pulls this in with `extra_configs = ../../kit.ini` and `extends = kit`.
; Versions are pinned so a project that builds today builds the same way next year.

[kit]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
; 460800 is a safe default; 921600 is faster but more likely to fail on long or cheap USB cables
upload_speed = 460800
lib_deps =
    symlink://../../lib/SingleButtonKit
    adafruit/Adafruit SSD1306@2.5.17
    adafruit/Adafruit GFX Library@1.12.6
