name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/sync_skills.py --check
      - run: python -m pytest -q

  build-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('kit.ini', 'requirements.txt') }}
      - run: python -m pip install -r requirements.txt
      - name: Build every example and the starter template
        run: |
          for project in examples/*/; do pio run -d "$project"; done
          python scripts/new_project.py ci_starter
          pio run -d my_projects/ci_starter
